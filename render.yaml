# Render Blueprint: Render reads this when you create a "Blueprint" from the GitHub repo.
# Secrets are not stored here; Render asks for them (sync: false) when you create the service.
services:
  - type: web
    name: kavach
    runtime: docker
    plan: starter  # the free plan has no disk, so every deploy would delete all accounts, families and voices
    healthCheckPath: /health
    disk:
      name: kavach-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: KAVACH_WARNING_VOICE_ID
        sync: false
      - key: PERSONA_VOICE_ID
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: KAVACH_ACCESS_KEY  # the operator key: it sees every family. Families use their own tokens.
        sync: false
      - key: DB_PATH
        value: /data/kavach.db
      - key: REPORTS_DIR
        value: /data/reports
      - key: VOICES_DIR
        value: /data/voices
