# Render Blueprint: Render reads this when you create a "Blueprint" from the GitHub repo.
# Secrets are not stored here; Render asks for them (sync: false) when you create the service.
services:
  - type: web
    name: kavach
    runtime: docker
    plan: starter  # the disk keeps the voice recordings; accounts and calls are in Supabase
    healthCheckPath: /health
    disk:
      name: kavach-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: KAVACH_WARNING_VOICE_ID
        sync: false
      - key: PERSONA_VOICE_ID
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: KAVACH_ACCESS_KEY  # the operator key: it sees every family. Families use their own tokens.
        sync: false
      - key: DATABASE_URL       # Supabase > Connect > Session pooler. Accounts, families and calls live there.
        sync: false
      - key: SUPABASE_URL       # https://<project>.supabase.co
        sync: false
      - key: SUPABASE_ANON_KEY  # the public key, used to check sign-ins
        sync: false
      - key: DB_PATH            # only used when DATABASE_URL is empty
        value: /data/kavach.db
      - key: REPORTS_DIR
        value: /data/reports
      - key: VOICES_DIR
        value: /data/voices
