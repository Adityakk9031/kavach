<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kavach · Receiver</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Kavach call simulator</h1>
    <span class="role" style="color: var(--receiver)">Receiver tab (the person we protect)</span>
    <span class="muted" id="callLabel"></span>
  </header>
  <main>
    <section class="panel">
      <div class="row">
        <button class="primary" id="answer">Answer call</button>
        <button class="danger" id="end" disabled>Hang up</button>
        <button id="handover" disabled title="Kavach talks to the caller for you; the caller cannot hear you">Hand over to Kavach</button>
        <button id="takeback" disabled hidden>Take back</button>
        <div class="meter"><div id="level"></div></div>
      </div>
      <p class="status" id="status">Not connected.</p>
      <p class="status bad" id="micError" style="color: var(--danger)"></p>
      <p class="muted">Use headphones: the warning plays here, and speakers can leak it back into your mic.</p>
    </section>
    <section class="panel" id="warningBox" hidden>
      <strong id="warnTitle"></strong>
      <p id="warnText" class="muted"></p>
    </section>
    <section class="panel" id="personaBox" hidden>
      <strong id="personaTitle">Kavach is on the call</strong>
      <p id="personaText" class="muted"></p>
    </section>
    <section class="panel" id="detection"></section>
    <section class="panel" id="evidenceBox" hidden>
      <strong>Evidence collected</strong>
      <table id="evidence" style="width:100%; font-size:14px; border-collapse:collapse"></table>
    </section>
    <section class="panel">
      <div id="transcript"></div>
    </section>
  </main>
  <script type="module">
    import { connectCall, startMic, Player, callIdFromUrl, SOURCE } from './audio.js';
    import { transcriptView, statusView, levelMeter, detectionView } from './ui.js';

    const callId = callIdFromUrl();
    document.getElementById('callLabel').textContent = `call: ${callId}`;
    const tv = transcriptView(document.getElementById('transcript'));
    const sv = statusView(document.getElementById('status'));
    const meter = levelMeter(document.getElementById('level'));
    const dv = detectionView(document.getElementById('detection'));
    const $ = (id) => document.getElementById(id);
    let call, player, mic;
    const seenEvidence = new Set();

    function addEvidence(items) {
      $('evidenceBox').hidden = false;
      for (const it of items) {
        const key = it.type + '|' + it.normalized;
        if (seenEvidence.has(key)) continue;
        seenEvidence.add(key);
        const tr = document.createElement('tr');
        tr.innerHTML = '<td style="padding:4px 8px; color:var(--muted)"></td><td style="padding:4px 8px"><b></b></td><td style="padding:4px 8px; color:var(--muted)"></td>';
        const [a, b, c] = tr.children;
        a.textContent = it.type.replaceAll('_', ' ');
        b.firstChild.textContent = it.value;
        c.textContent = '"' + it.quote + '"';
        $('evidence').appendChild(tr);
      }
    }

    function showTakeover(on) {
      $('handover').hidden = on;
      $('takeback').hidden = !on;
      $('takeback').disabled = !on;
      $('personaBox').hidden = !on && $('personaText').textContent === '';
      $('personaTitle').textContent = on ? 'Kavach is on the call (the caller cannot hear you)' : 'You are back on the call';
    }

    function showWarning(ev) {
      const box = $('warningBox');
      box.hidden = false;
      const titles = { speaking: 'Kavach is speaking', done: 'Warning finished', interrupted: 'Warning stopped: you spoke',
                       error: 'Warning failed' };
      $('warnTitle').textContent = titles[ev.state] || ev.state;
      if (ev.text) $('warnText').textContent = ev.text + (ev.cloned === false ? '  (fallback voice, not the cloned voice)' : '');
      if (ev.error) $('warnText').textContent = ev.error;
    }

    // Local voice detection: 3 consecutive loud 50 ms chunks while the warning plays = barge-in. Stop playback
    // here first (no network round trip), then tell the server to cancel the TTS request.
    let loud = 0;
    function vad(pcm) {
      if (!player || !player.isPlaying(SOURCE.WARNING)) { loud = 0; return; }
      let peak = 0;
      for (let i = 0; i < pcm.length; i++) peak = Math.max(peak, Math.abs(pcm[i]));
      loud = peak > 2500 ? loud + 1 : 0;
      if (loud >= 3) {
        loud = 0;
        player.flush(SOURCE.WARNING);
        call.send({ type: 'barge_in' });
        call.clientEvent('playback_stopped', { source: SOURCE.WARNING });
      }
    }

    $('answer').onclick = async () => {
      player = new Player((source, leadMs) => call.clientEvent('playback_started', { source, lead_ms: leadMs }));
      await player.resume();
      call = connectCall(callId, 'receiver', {
        onEvent(ev) {
          if (sv.handle(ev) || dv.handle(ev)) return;
          if (ev.type === 'transcript') tv.show(ev);
          else if (ev.type === 'flush_playback') player.flush(ev.source);
          else if (ev.type === 'warning') showWarning(ev);
          else if (ev.type === 'takeover') showTakeover(ev.state === 'on');
          else if (ev.type === 'persona' && ev.text) { $('personaBox').hidden = false; $('personaText').textContent = 'Kavach says: ' + ev.text; }
          else if (ev.type === 'evidence') addEvidence(ev.items);
          else if (ev.type === 'call_ended') $('status').textContent = 'Call ended.';
        },
        onAudio(source, pcm) { player.play(source, pcm); },
      });
      call.ws.onopen = async () => {
        $('answer').disabled = true;
        $('end').disabled = false;
        $('handover').disabled = false;
        try {
          mic = await startMic((buf) => { const pcm = new Int16Array(buf); meter(pcm); vad(pcm); call.sendAudio(buf); });
        } catch (e) {
          $('micError').textContent = `Microphone unavailable (${e.name}). You can still hear the caller.`;
        }
      };
    };
    $('end').onclick = () => { call.send({ type: 'end_call' }); mic && mic.stop(); };
    $('handover').onclick = () => call.send({ type: 'takeover' });
    $('takeback').onclick = () => { player.flush(SOURCE.PERSONA); call.send({ type: 'takeback' }); };

    // ?watch=1: read-only view of a call that other clients (or the eval runner) are driving.
    if (new URLSearchParams(location.search).get('watch')) {
      $('answer').disabled = true;
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(`${proto}://${location.host}/ws/events/${encodeURIComponent(callId)}`);
      ws.onmessage = (e) => {
        const ev = JSON.parse(e.data);
        if (sv.handle(ev) || dv.handle(ev)) return;
        if (ev.type === 'transcript') tv.show(ev);
        else if (ev.type === 'warning') showWarning(ev);
        else if (ev.type === 'takeover') showTakeover(ev.state === 'on');
        else if (ev.type === 'persona' && ev.text) { $('personaBox').hidden = false; $('personaText').textContent = 'Kavach says: ' + ev.text; }
        else if (ev.type === 'evidence') addEvidence(ev.items);
      };
    }
  </script>
</body>
</html>
