# Render's free plan puts the server to sleep after 15 minutes without a visit, and waking it takes most of a minute:
# a scam call that starts then is not protected until it is up. This visits it every 10 minutes so it stays awake.
# Not needed on a paid Render plan (those never sleep): delete this file then.
name: Keep the server awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Visit the health page
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${KAVACH_SERVER:-https://kavach-yvtn.onrender.com}/health"
        env:
          KAVACH_SERVER: ${{ vars.KAVACH_SERVER }}
